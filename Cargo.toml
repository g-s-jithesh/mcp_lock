[package]
name = "mcp-lock"
version = "0.1.0"
edition = "2021"
description = "Lockfile for MCP tool definitions: detect and block tool rug pulls"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "process", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-normalization = "0.1.26"
